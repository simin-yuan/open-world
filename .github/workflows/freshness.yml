# 外部判据：这份记录还连着本机吗
#
# 这是本仓库唯一一条"别人能看、我改不了结果"的判据。
# 它不评测我的作品好不好 —— 它只问一件事：记录还活着吗。
# 红了就是我自己失职，不是 GitHub 出问题。
name: freshness

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `if: always()` 是刻意的：默认语义下一步失败即终止整个 job，
      # 于是越靠前的步骤越能把后面的结论挡在日志外面（2026-09-29 实测过一次：
      # selftest 的对照红，check.py「四条腿到底怎么样」在日志里根本看不到）。
      # always() 只让后面的步**照跑照打印**，不改判定 —— job 该红的还是红。
      - name: 证明这条闸能说不，且在干净输入上说得出通过
        run: python verify/selftest.py
      - name: 证明 gate_stat 的契约与阈值也能说是（不只是恒真拒绝）
        if: always()
        run: python verify/selftest_gate_stat.py
      - name: 证明隐私闸能说不（S1/S2/S3/字面词各自的坏样本、缺词表、豁免两半都要按预期红/绿）
        if: always()
        run: python verify/selftest_leakscan.py
      # 只跑形状层：字面词层要本机词表 _local/privterms.txt，CI 的干净 clone 上没有。
      # 绿不代表字面层干净 —— 脚本自己会把「L2 未跑」打进日志，别把这一行当全套结论。
      - name: 隐私闸（形状层；字面词层见 findings/09）
        if: always()
        run: python verify/leakscan.py --shape-only
      # 接线也是判据：闸自己有自证，但「它接在发布路径上」是另一件事 ——
      # 一个接错位置的闸和没有闸长得一模一样。这一步在干净 clone 上自造词表跑，
      # 不依赖本机 _local/。红 = 导出会因为闸红而拒绝产出（09:20/21:20 那条桥会停）。
      - name: 证明发布前隐私闸真的接在发布路径上（不是只跑在 CI 里）
        if: always()
        run: python verify/selftest_export_gate.py
      # 树之外的**第二个发布面**：一次 `git push` 还送走 `<upstream>..HEAD` 每条提交的 message。
      # 树绿 ≠ 信息干净（findings/12 的实测：树上 LEAKS=0，提交标题里带着本机绝对路径）。
      # 自造本地裸仓当远程，不联网、不读 live 仓；词表层在干净 clone 上是 UNDECIDABLE，
      # 脚本会把「词表读不到」打进日志 —— 这一行的绿不证明字面词那一半。
      - name: 证明「待推提交信息」这道闸能说不（两类样本 + 三种非通过状态）
        if: always()
        run: python verify/selftest_pushscope_gate.py
      # 变异测试：把闸复制进临时目录、注入三处失能变异，它自己的自证必须跟着红。
      # 只数 rc 不够 —— 脚本按**用例名**核对红在对的那一道上，模块崩了不算抓到。
      - name: 证明上面这道闸的自证不是装饰（三次变异都要被抓到）
        if: always()
        run: python verify/falsify_pushscope_gate.py
      # 本体 verify/bridge_landed.py 不进 CI：干净 clone 里「本地 HEAD == 远程」是重言的，
      # 一个永远绿的检查就是装饰。这里只跑它的自证（本地裸仓自造四态，不联网）。
      - name: 证明「本地提交 ≠ 远程收到」这条判据能说不（本体见 findings/11）
        if: always()
        run: python verify/selftest_bridge_landed.py
      - name: check the four legs
        if: always()
        run: python verify/check.py
      - name: summary
        if: always()
        run: |
          {
            echo "### freshness"
            echo ""
            echo "跑的是 \`verify/selftest.py\`（7 个已知坏样本 + 1 个**自造**干净对照，不读 live）和 \`verify/check.py\`。"
            echo "只看仓库里的文件，不问本机。阈值与理由写在脚本头部 —— 改阈值等于改判据，会留下提交记录。"
            echo "隐私闸 verify/leakscan.py --shape-only 只覆盖形状层（词表在本机 _local/，CI 拿不到）：CI 的绿不证明字面词干净 —— 脚本会把「L2 未跑」打进日志，见 findings/09。"
            echo "verify/selftest_export_gate.py 证明这道闸**接在发布路径上**（导出工具出口、fail-closed），不是只跑在 CI 里 —— 见 findings/10。"
            echo "verify/selftest_pushscope_gate.py + verify/falsify_pushscope_gate.py 覆盖**树之外的发布面**（待推提交信息）：push 送走的还有 message，树绿不代表信息干净 —— 见 findings/12。"
          } >> "$GITHUB_STEP_SUMMARY"
